<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Weather</h1>
    <form id="search">
      <input id="city" type="text" placeholder="Search city…" autocomplete="off" required />
      <button type="submit">Search</button>
      <button type="button" id="locate" title="Use my location">📍</button>
      <button type="button" id="units" title="Toggle units">°C</button>
    </form>
    <p id="status" role="status"></p>
    <section id="current" hidden>
      <h2 id="place"></h2>
      <div class="now">
        <span id="icon" class="icon"></span>
        <span id="temp" class="temp"></span>
      </div>
      <p id="desc"></p>
      <ul class="details">
        <li>Feels like <strong id="feels"></strong></li>
        <li>Humidity <strong id="humidity"></strong></li>
        <li>Wind <strong id="wind"></strong></li>
      </ul>
    </section>
    <section id="forecast" hidden></section>
  </main>
  <footer>Data: <a href="https://open-meteo.com/">Open-Meteo</a></footer>
  <script src="app.js"></script>
</body>
</html>
